<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Luiz Paulo Antunes — AI Quality, LLM Evaluation and Test Automation</title>
  <desc id="desc">Dark professional banner with an agent-to-evaluation-to-evidence workflow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <circle cx="1100" cy="24" r="180" fill="#7c3aed" opacity="0.08"/>
  <circle cx="1020" cy="310" r="210" fill="#0ea5e9" opacity="0.08"/>
  <rect x="60" y="53" width="7" height="194" rx="3.5" fill="url(#accent)"/>
  <text x="96" y="112" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="43" font-weight="700">Luiz Paulo Antunes</text>
  <text x="98" y="158" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23">Senior QA Engineer &amp; AI Quality Consultant</text>
  <text x="98" y="205" fill="#7dd3fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" letter-spacing="1">AI QUALITY  ·  LLM EVALUATION  ·  TEST AUTOMATION</text>
  <g transform="translate(745 90)" font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
    <path d="M82 58H142M242 58H302" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <path d="M132 52l10 6-10 6M292 52l10 6-10 6" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g filter="url(#glow)">
      <circle cx="40" cy="58" r="40" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="2"/>
      <circle cx="200" cy="58" r="40" fill="#0c2a3b" stroke="#38bdf8" stroke-width="2"/>
      <circle cx="360" cy="58" r="40" fill="#102a27" stroke="#34d399" stroke-width="2"/>
    </g>
    <text x="40" y="64" fill="#ede9fe" font-size="15" font-weight="700">AGENT</text>
    <text x="200" y="64" fill="#e0f2fe" font-size="15" font-weight="700">EVALS</text>
    <text x="360" y="64" fill="#d1fae5" font-size="15" font-weight="700">EVIDENCE</text>
    <text x="200" y="133" fill="#94a3b8" font-size="14">behavior · tools · safety · release</text>
  </g>
